[build]
  command = "npm run build"
  functions = "netlify/functions"
  publish = "dist"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/server/:splat"
  status = 200

# Cabeceras de seguridad para los archivos estáticos (Netlify los sirve sin pasar por Express).
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; script-src 'self' https://*.clarity.ms https://*.googletagmanager.com https://*.google-analytics.com https://*.analytics.google.com; style-src 'self'; img-src 'self' data: blob: https://*.clarity.ms https://*.googletagmanager.com https://*.google-analytics.com https://*.analytics.google.com; font-src 'self'; connect-src 'self' https://*.clarity.ms https://*.googletagmanager.com https://*.google-analytics.com https://*.analytics.google.com; frame-src 'self' https://*.googletagmanager.com; object-src 'none'; frame-ancestors 'none'; form-action 'self'; require-trusted-types-for 'script'; trusted-types rf-html default; upgrade-insecure-requests"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Resource-Policy = "same-origin"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"

# Caché del navegador para imágenes y fuentes: se guardan 7 días (y se pueden usar 1 día más mientras se revalidan),
# así cambiar de pestaña en el blog no vuelve a descargar las portadas. Si reemplazas una imagen por otra con el
# mismo nombre, algunos visitantes podrían ver la anterior hasta 7 días: usa un nombre nuevo en ese caso.
[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
